  <path d="M110 34 L200 58 L190 176 L110 270 L30 176 L20 58 Z" transform="translate(110 150) scale(0.91) translate(-110 -150)" fill="#F5B800"/>
  <path d="M110 34 L200 58 L190 176 L110 270 L30 176 L20 58 Z" transform="translate(110 150) scale(0.87) translate(-110 -150)" fill="url(#b-field)"/>
